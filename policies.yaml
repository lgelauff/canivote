# Voter-eligibility policies, one per wiki and procedure.
#
# Each policy carries the community's own wording verbatim, an English rendering
# of it, and the rules that wording decomposes into. Editing this file is how
# eligibility changes: a reviewable diff, not a code change. /policies serves it,
# so what is written here is what the public sees.
#
# `not_modelled` is not an oversight. Some clauses are human judgements and are
# recorded so a verdict never looks more complete than it is.

nlwiki-stemprocedure:
  wiki: nl.wikipedia.org
  language: nl
  title: Voting eligibility on Dutch Wikipedia
  scope: All votes (stemmingen) held under the Stemprocedure
  sources:
    - https://nl.wikipedia.org/wiki/Wikipedia:Stemprocedure
    - https://nl.wikipedia.org/wiki/Wikipedia:Stemlokaal/Stemgerechtigde_gebruikers
  verified: 2026-09-01
  original_text: >-
    Stemmen mag iedere gebruiker met bewerkingsrechten op de stempagina,
    die voldoet aan de volgende twee voorwaarden: hij of zij heeft (minstens)
    twee weken voor het begin van de stemming zijn eerste bewerking gedaan
    als aangemelde gebruiker; hij of zij had meer dan 100 bewerkingen (geen
    vandalisme) gedaan voordat het stemvoorstel in het stemlokaal (of
    subpagina daarvan) gezet werd (ingangstijd/datum van stemvoorstel dient
    ter referentie).
  english: >-
    You must hold editing rights on the voting page — that is, you must not
    be site-wide blocked on Dutch Wikipedia. You must have made your first
    edit as a registered user at least two weeks before the vote opened, and
    have made more than 100 edits before the proposal was posted (the
    proposal's timestamp is the reference point).
  rules:
    - metric: is_blocked
      wiki: nl.wikipedia.org
      operator: is
      value: false
    - metric: time_since_first_edit
      wiki: nl.wikipedia.org
      operator: at_least
      value: {amount: 2, unit: weeks}
    - metric: edit_count
      wiki: nl.wikipedia.org
      operator: more_than
      value: 100
  not_modelled:
    - >-
      "geen vandalisme" — the 100 edits must not be vandalism. Whether an edit
      is vandalism is a human judgement and is not checked here.
  notes: >-
    Article 3 of the Stemprocedure is the general rule. Its two clauses use
    different reference points — the vote opening for the first edit, the
    proposal being posted for the edit count — and the gap between them is set
    per vote rather than by the policy, so this entry cannot carry it.

    Pass `as_of` set to the vote's opening to place the first-edit clause
    correctly. The edit-count clause anchors earlier still, on the proposal, and
    an `offset` on that rule can express the difference for a particular vote.
    With neither, both are measured from now: ask after the vote opens and edits
    made since the proposal are wrongly counted, ask before it and the bar sits
    earlier than the policy sets it.

    Voting rights, once earned, are held for life ("voor het leven"): nl.wikipedia
    sets no ongoing-activity requirement, so nothing here expires.

    The second source page records a 2018 proposal to add an activity requirement
    for person-elections. It was NOT adopted, and is cited only so a reader who
    finds it knows it does not apply.

dewiki-stimmberechtigung:
  wiki: de.wikipedia.org
  language: de
  title: Voting eligibility on German Wikipedia
  scope: Meinungsbilder, admin and functionary elections, recalls, user bans
  sources:
    - https://de.wikipedia.org/wiki/Wikipedia:Stimmberechtigung
  verified: 2026-09-01
  original_text: >-
    Allgemeine Stimmberechtigung: Der Benutzer ist angemeldet. Der Benutzer
    hat seit mindestens zwei Monaten aktiv mitgearbeitet. Der Benutzer hat
    mindestens 200 Bearbeitungen (Edits) im Artikelnamensraum vorgenommen,
    und davon mindestens 50 in den letzten 12 Monaten.

    Nicht stimmberechtigt, selbst wenn die oben genannten Vorgaben erfüllt
    werden: gesperrte Benutzer — während einer Sperre dürfen Benutzer nicht
    abstimmen. Stimmen von Bots werden gestrichen.
  english: >-
    You must be logged in, have been actively contributing for at least two
    months, and have made at least 200 edits in the article namespace, of which
    at least 50 in the last twelve months. You must not be site-wide blocked,
    and your account must not be a bot.
  rules:
    - metric: is_blocked
      wiki: de.wikipedia.org
      operator: is
      value: false
    - metric: user_groups
      wiki: de.wikipedia.org
      operator: excludes
      value: bot
    - metric: time_since_first_edit
      wiki: de.wikipedia.org
      operator: at_least
      value: {amount: 2, unit: months}
    - metric: edit_count
      wiki: de.wikipedia.org
      namespace: article
      operator: at_least
      value: 200
    - metric: edit_count
      wiki: de.wikipedia.org
      namespace: article
      within: {amount: 12, unit: months}
      operator: at_least
      value: 50
  notes: >-
    The policy is explicit that account creation does not count — the first
    *edit* must be two months old. German Wikipedia runs its own checker at
    toollabs:stimmberechtigung.

enwiki-arbcom:
  wiki: en.wikipedia.org
  language: en
  title: Arbitration Committee election eligibility on English Wikipedia
  scope: >-
    ArbCom elections, the only community SecurePoll election on this wiki.
    Requests for adminship deliberately have no voter criteria.
  sources:
    - https://en.wikipedia.org/wiki/Wikipedia:Arbitration_Committee_Election/Rules
  verified: 2026-09-01
  original_text: >-
    A voter needs 150 mainspace edits on English Wikipedia by 1 November, 10
    live edits on English Wikipedia (in any namespace) within one year of
    1 November, and to have registered an account before 1 October, not
    currently sitewide blocked at the time of voting. Bots are excluded.
  english: >-
    You must have 150 article-namespace edits, 10 edits of any kind in the past
    year, an account created at least a month before the cutoff, no site-wide
    block, and not be a bot.
  rules:
    - metric: edit_count
      wiki: en.wikipedia.org
      namespace: article
      operator: at_least
      value: 150
    - metric: edit_count
      wiki: en.wikipedia.org
      within: {amount: 12, unit: months}
      operator: at_least
      value: 10
    - metric: time_since_registration
      wiki: en.wikipedia.org
      operator: at_least
      value: {amount: 1, unit: months}
    - metric: is_blocked
      wiki: en.wikipedia.org
      operator: is
      value: false
    - metric: user_groups
      wiki: en.wikipedia.org
      operator: excludes
      value: bot
  not_modelled:
    - >-
      Accounts renamed to names containing "Vanished" or "Renamed" are excluded.
    - >-
      All requirements must be met from the same named account.
  notes: >-
    The real policy fixes calendar dates (1 October, 1 November) that are reset
    for each annual election, so they are written here as durations rather than
    dates, and the entry stays correct year to year.

    Durations are measured from whatever moment the check is made against, so
    **pass `as_of` set to the election's own cutoff** and they land exactly where
    the policy puts them. Without it the moment is "now", and the answer drifts
    in both directions rather than one: asked after 1 November the window is too
    late and admits people the policy excludes, asked before it the window is too
    early and excludes people the policy admits. An earlier version of this note
    claimed the drift was always generous. It is not.

meta-global:
  wiki: meta.wikimedia.org
  language: en
  title: Not blocked anywhere in the movement
  scope: >-
    A minimal baseline for cross-wiki consultations: no per-project activity
    bar, only that the account is in good standing movement-wide.
  sources:
    - https://meta.wikimedia.org/wiki/Global_locks
    - https://meta.wikimedia.org/wiki/Global_blocks
  verified: 2026-09-01
  original_text: >-
    Global locks prevent an account from logging in to any Wikimedia wiki.
  english: >-
    Your account must not be globally locked or globally blocked.
  rules:
    - metric: is_globally_locked
      operator: is
      value: false
    - metric: is_globally_blocked
      operator: is
      value: false

frwiki-sondage:
  wiki: fr.wikipedia.org
  language: fr
  title: Surveys and decisions on French Wikipedia
  scope: Sondages and prises de décision
  sources:
    - https://fr.wikipedia.org/wiki/Aide:Sondage
  verified: 2026-09-01
  original_text: La conduite du sondage est totalement libre.
  english: The conduct of a survey is entirely open.
  rules: []
  notes: >-
    A deliberate empty case. French Wikipedia codifies no voter eligibility for
    surveys, and "no formal requirement" is a real answer rather than missing
    data. A site-wide block bars a user from editing any page including the
    vote, so the platform applies that check regardless.

ukwiki-adminship:
  wiki: uk.wikipedia.org
  language: uk
  title: Voting in adminship requests on Ukrainian Wikipedia
  scope: >-
    Votes on requests for administrator rights (Заявки на права адміністратора,
    ВП:ЗПА).
  sources:
    - https://uk.wikipedia.org/wiki/%D0%92%D1%96%D0%BA%D1%96%D0%BF%D0%B5%D0%B4%D1%96%D1%8F:%D0%97%D0%B0%D1%8F%D0%B2%D0%BA%D0%B8_%D0%BD%D0%B0_%D0%BF%D1%80%D0%B0%D0%B2%D0%B0_%D0%B0%D0%B4%D0%BC%D1%96%D0%BD%D1%96%D1%81%D1%82%D1%80%D0%B0%D1%82%D0%BE%D1%80%D0%B0
    - https://uk.wikipedia.org/wiki/%D0%92%D1%96%D0%BA%D1%96%D0%BF%D0%B5%D0%B4%D1%96%D1%8F:%D0%97%D0%B0%D1%8F%D0%B2%D0%BA%D0%B8_%D0%BD%D0%B0_%D0%BF%D1%80%D0%B0%D0%B2%D0%B0_%D0%B0%D0%B4%D0%BC%D1%96%D0%BD%D1%96%D1%81%D1%82%D1%80%D0%B0%D1%82%D0%BE%D1%80%D0%B0/Header
    - https://uk.wikipedia.org/w/index.php?diff=41112004
  verified: 2026-10-27
  original_text: >-
    Голосувати можуть лише зареєстровані користувачі, які на момент початку
    голосування мають: права патрульного або принаймні 500 редагувань в
    основному просторі та стаж у Вікіпедії не менше трьох місяців; принаймні 5
    редагувань основного простору назв, або будь-якого іншого простору назв,
    який має безпосередній стосунок до основного контенту Вікіпедії (Шаблон,
    Категорія, Файл, Модуль, MediaWiki або Портал) в проміжку: 3 календарних
    місяці — 1 тиждень до початку номінації. У разі виникнення спірних
    випадків рішення щодо них ухвалюється бюрократами. За себе не можна
    голосувати.
  english: >-
    Only registered users may vote who, when voting opens, have (1) patroller
    rights, or at least 500 article edits and at least three months on the
    wiki; and (2) at least 5 edits to articles or to another namespace directly
    tied to the encyclopedic content (Template, Category, File, Module,
    MediaWiki or Portal) between 3 calendar months and 1 week before the
    nomination opened. Bureaucrats decide disputed cases. You may not vote for
    yourself.
  rules:
    - any_of:
        - metric: user_groups
          wiki: uk.wikipedia.org
          operator: includes
          value: editor
        - all_of:
            - metric: edit_count
              wiki: uk.wikipedia.org
              namespace: article
              operator: at_least
              value: 500
            - metric: time_since_first_edit
              wiki: uk.wikipedia.org
              operator: at_least
              value: {amount: 3, unit: months}
    - metric: edit_count
      wiki: uk.wikipedia.org
      namespace: [0, 6, 8, 10, 14, 100, 828]
      offset: {amount: 1, unit: weeks}
      within: 83
      operator: at_least
      value: 5
  not_modelled:
    - >-
      "У разі виникнення спірних випадків рішення щодо них ухвалюється
      бюрократами" — disputed cases are decided by bureaucrats. A verdict here
      is not the final word on a contested vote.
    - >-
      "За себе не можна голосувати" — a candidate may not vote on their own
      request. That depends on the vote, not the account.
  notes: >-
    The first clause groups as "patroller, OR (500 article edits AND three
    months)": patrollers need neither the edit count nor the time on the wiki.
    That reading is taken from the talk-page summary in diff 41112004
    (2023-12-10), which moved "стаж" from its own line, where it applied to
    everyone, into the 500-edits alternative. "Стаж" is measured from the first
    edit, as in the Dutch and German policies.

    "Права патрульного" is the `editor` user group, which this wiki names
    "Патрульні" (MediaWiki:Group-editor-member is "патрульний"). Group
    membership is read as it is now, not as of `as_of`, so a patroller flag
    granted or removed since the vote opened shows its current state.

    Pass `as_of` set to the opening of the vote. The second clause is anchored
    on the start of the nomination instead; voting runs from the candidate's
    confirmation, usually close to the nomination but not always the same
    moment. Its window ends one week before the anchor (`offset`) and starts
    three months before it: 90 days back, written as `within: 83` days behind
    the offset. The policy says calendar months, so this can differ from the
    calendar by up to two days.

    The namespaces counted are those the policy lists: article (0), File (6),
    MediaWiki (8), Template (10), Category (14), Portal (100) and Module (828).
    The list is read as exhaustive, so TimedText (710) is not counted.

    One check costs six Wikimedia API calls, the most the rate limit allows for.
