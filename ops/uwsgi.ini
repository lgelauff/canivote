; uWSGI config for canivote on Toolforge. This file is symlinked in as
; ~/www/python/uwsgi.ini (see the deploy steps in the plan) — do not copy it,
; a copy silently drifts from the version in the repo.
;
; The [uwsgi] section header is mandatory: uWSGI silently ignores an .ini
; file that starts straight into key=value lines without one.
[uwsgi]
module = app:app
enable-threads = true

; The app is entirely I/O-bound on the WMF API, so one process gives the same
; throughput as several while keeping the in-memory rate limiter and the
; short-TTL cache exact -- with more than one process each would be its own
; independent instance, multiplying the effective rate limit and duplicating
; (and disagreeing on) cached verdicts.
processes = 1
threads = 8
